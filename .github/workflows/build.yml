name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Module
        run: |
          chmod +x ./gradlew
          sed -i "s/moduleDescription/moduleDescription - (${{ github.event.inputs.package_name }})/g" ./module/src/main/resources/module.prop
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" ./module/src/main/cpp/main.cpp
          ./gradlew :module:assembleRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/
